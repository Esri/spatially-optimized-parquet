[package]
name = "spatial"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
print-plan = []

[dependencies]
async-trait = "0.1"
arrow-array = { version = "58.3.0", features = ["ffi"] }
arrow-schema = { version = "58.3.0", features = ["canonical_extension_types"] }
datafusion = "54.1.0"
datafusion-execution = "54.1.0"
futures-util = "0.3"
gdal = "0.19"
gdal-src = { version = "0.3", features = ["driver_gpkg"] }
gdal-sys = { version = "0.12", features = ["bundled"] }
parquet = { version = "58.3.0", features = ["arrow", "brotli", "flate2", "geospatial", "lz4", "object_store", "snap", "zstd"] }
parquet-geospatial = "58.3.0"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.13"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
object_store = { version = "0.13", features = ["http"] }
url = "2.5"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[dev-dependencies]
criterion = "0.7"

[[bin]]
name = "sop-test-data"
path = "src/bin/sop_test_data.rs"

[[bench]]
name = "writer"
harness = false
